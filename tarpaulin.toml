# Cargo Tarpaulin Configuration
# https://github.com/xd009642/tarpaulin

[tarpaulin]
# Workspace configuration
workspace = true
all-features = true

# Coverage threshold. Keep this aligned with .github/workflows/test_coverage.yml.
fail-under = 45.0

# Timeout for test execution (5 minutes)
timeout = "300s"

# Verbose output for debugging
verbose = true

# Exclusions - don't measure coverage for these
exclude-files = [
    "target/*",
    "*/tests/*",
    "*/benches/*",
    "*/examples/*",
]

[report]
# Generate the same machine-readable formats CI uploads.
out = ["Xml", "Json"]
output-dir = "coverage"
